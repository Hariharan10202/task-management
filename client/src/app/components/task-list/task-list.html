<div class="container">
  <header class="header">
    <div>
      <h1>Taskly</h1>
      <p>Task management</p>
    </div>

    <button (click)="showForm.set(true); formMode.set('create')">+ New Task</button>
  </header>

  <h2 class="title">Welcome back 👋</h2>

  <app-task-stats
    [total]="total()"
    [pending]="pending()"
    [inProgress]="inProgress()"
    [completed]="completed()"
    [overdue]="overdue()"
  />

  <app-task-filter
    [selectCount]="selectedCount()"
    (filtersChanged)="onFiltersChanged($event)"
    (delete)="deleteSelected()"
    (markAsCompleted)="markSelectedCompleted()"
    (handleExport)="handleExport($event)"
  />

  @if (loading()) {
    <div class="loader-backdrop">
      <div class="spinner"></div>
      <p>Loading tasks...</p>
    </div>
  }

  <div
    class="card-container"
    cdkDropList
    [cdkDropListData]="latestTasks()"
    cdkDropListOrientation="mixed"
    (cdkDropListDropped)="drop($event)"
  >
    @for (task of latestTasks(); track task.id) {
      <div cdkDrag>
        <app-task-card
          [task]="task"
          [selected]="isSelectedMap().has(task.id!)"
          (cardSelect)="toggleSelect(task.id!)"
          (edit)="editTask(task)"
          (delete)="openDeleteConfirm(task.id!)"
          (statusToggle)="statusToggle($event)"
          (duplicateTask)="openDuplicate($event)"
          (uploadAttachment)="onUploadAttachment($event)"
          (deleteAttachment)="onDeleteAttachment($event)"
        />
      </div>
    }
  </div>
</div>

<app-task-pagination
  [page]="page"
  [totalPages]="totalPages()"
  [hasMore]="hasMore"
  (pageChange)="onPageChange($event)"
/>

@if (showForm()) {
  <app-modal (close)="closeForm()">
    <app-task-form
      [task]="selectedTask()"
      (close)="closeForm()"
      (save)="formMode() === 'edit' ? update($event) : create($event)"
      [mode]="formMode()"
    ></app-task-form>
  </app-modal>
}

@if (showConfirmModal()) {
  <app-modal (close)="closeForm()">
    <h3>Confirm Delete</h3>
    <p>Are you sure you want to delete this task?</p>

    <div class="actions">
      <button class="cancel" (click)="cancelDelete()">Cancel</button>
      <button class="delete" (click)="confirmDelete()">Delete</button>
    </div>
  </app-modal>
}

<app-task-toast></app-task-toast>
