<div class="stats-container">
  <div class="stats">
    <div class="stat-widget total">
      <div class="stat-top">
        <div class="stat-icon">
          <svg
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="1" y="1" width="6" height="6" rx="1" />
            <rect x="9" y="1" width="6" height="6" rx="1" />
            <rect x="1" y="9" width="6" height="6" rx="1" />
            <rect x="9" y="9" width="6" height="6" rx="1" />
          </svg>
        </div>
        <span class="stat-badge">Per Page</span>
      </div>
      <div class="stat-body">
        <span class="stat-number">{{ total }}</span>
        <span class="stat-label">Total tasks</span>
      </div>
      <div class="stat-footer">
        <div class="progress-bar">
          <div class="progress-fill" style="width: 100%"></div>
        </div>
        <span class="stat-meta">Across all statuses</span>
      </div>
    </div>

    <div class="stat-widget pending">
      <div class="stat-top">
        <div class="stat-icon">
          <svg
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="8" cy="8" r="6.5" />
            <path d="M8 4.5V8l2.5 1.5" />
          </svg>
        </div>
      </div>
      <div class="stat-body">
        <span class="stat-number">{{ pending }}</span>
        <span class="stat-label">Pending</span>
      </div>
      <div class="stat-footer">
        <div class="progress-bar">
          <div class="progress-fill" [style.width.%]="pending"></div>
        </div>
        <span class="stat-meta">{{ overdue }} overdue</span>
      </div>
    </div>

    <div class="stat-widget in-progress">
      <div class="stat-top">
        <div class="stat-icon">
          <svg
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M2 8h3l2-5 3 10 2-5h2" />
          </svg>
        </div>
      </div>
      <div class="stat-body">
        <span class="stat-number">{{ inProgress }}</span>
        <span class="stat-label">In progress</span>
      </div>
    </div>

    <div class="stat-widget completed">
      <div class="stat-top">
        <div class="stat-icon">
          <svg
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="8" cy="8" r="6.5" />
            <path d="M5 8l2 2 4-4" />
          </svg>
        </div>
      </div>
      <div class="stat-body">
        <span class="stat-number">{{ completed }}</span>
        <span class="stat-label">Completed</span>
      </div>
    </div>
  </div>
  <div class="chart-wrapper">
    <canvas #chartCanvas></canvas>
  </div>
</div>
