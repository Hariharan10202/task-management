<h1>{{ task ? 'Edit Task' : 'Create New Task' }}</h1>

<form [formGroup]="form" (ngSubmit)="submit()" class="form">
  <div class="form-group">
    <input placeholder="Title" formControlName="title" />

    @if (form.get('title')?.touched && form.get('title')?.invalid) {
      <small>Title is required</small>
    }
  </div>

  <div class="form-group">
    <textarea placeholder="Description" formControlName="description"></textarea>
  </div>

  <div class="form-group">
    <select formControlName="status">
      <option value="pending">Pending</option>
      <option value="in_progress">In Progress</option>
      <option value="completed">Completed</option>
    </select>
  </div>

  <div class="form-group">
    <select formControlName="priority">
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>
  </div>

  <div class="form-group">
    <input type="date" formControlName="due_date" [min]="today" />

    @if (form.get('due_date')?.touched && form.get('due_date')?.errors?.['pastDate']) {
      <small>Due date cannot be in the past</small>
    }
  </div>

  <div class="actions-container">
    <button (click)="closeModal()" type="button">Cancel</button>
    <button type="submit" [disabled]="form.invalid">
      {{ task ? 'Update Task' : 'Save Task' }}
    </button>
  </div>
</form>
